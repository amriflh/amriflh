<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto">
  <defs>
    <!-- Sky & Volcanic Atmosphere Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020905" />
      <stop offset="40%" stop-color="#0b1f11" />
      <stop offset="75%" stop-color="#122a15" />
      <stop offset="100%" stop-color="#1d3d1a" />
    </linearGradient>

    <!-- Volcanic Amber Sun & Horizon Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="1" />
      <stop offset="25%" stop-color="#FBBF24" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Sunlit Mountain Facet (Volcanic Ridge Lime & Amber) -->
    <linearGradient id="sunlitFacet" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="50%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>

    <!-- Amber Ridge Highlight Facet -->
    <linearGradient id="amberFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#2d4a0f" />
    </linearGradient>

    <!-- Shadowed Mountain Facet -->
    <linearGradient id="shadowFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#224817" />
      <stop offset="60%" stop-color="#0d240f" />
      <stop offset="100%" stop-color="#051408" />
    </linearGradient>

    <!-- Far Distance Peak Facet -->
    <linearGradient id="sunlitFar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#14300d" stop-opacity="0.9" />
    </linearGradient>

    <!-- Volcanic Crest Snow / Ember Cap Light -->
    <linearGradient id="snowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#D9F99D" />
    </linearGradient>

    <linearGradient id="snowShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>

    <!-- Volcanic Fog & Mist Gradient -->
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="40%" stop-color="#84CC16" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#04120C" stop-opacity="0.85" />
    </linearGradient>

    <!-- Light Rays / Volumetric Volcanic Light -->
    <linearGradient id="lightRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0" />
    </linearGradient>

    <!-- Text Shadow & Glow Filter -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" fill="url(#skyGrad)" rx="16" />

  <!-- Volcanic Ridge Aurora / Sky Wave -->
  <path d="M 0,90 Q 300,30 600,100 T 1200,60 L 1200,0 L 0,0 Z" fill="url(#amberGlow)" opacity="0.3" />

  <!-- Stars Field -->
  <g fill="#FEF3C7">
    <circle cx="90" cy="35" r="1.5" opacity="0.9" />
    <circle cx="210" cy="65" r="2" opacity="0.8" />
    <circle cx="340" cy="25" r="1.2" opacity="0.6" />
    <circle cx="480" cy="50" r="1.8" opacity="0.85" />
    <circle cx="720" cy="30" r="1.4" opacity="0.75" />
    <circle cx="860" cy="60" r="2.2" opacity="0.95" />
    <circle cx="1020" cy="40" r="1.2" opacity="0.65" />
    <circle cx="1130" cy="75" r="1.8" opacity="0.8" />
    <polygon points="210,65 212,65 210,67 208,65" fill="#F59E0B" />
    <polygon points="860,60 863,60 860,63 857,60" fill="#FBBF24" />
  </g>

  <!-- Glowing Volcanic Amber Sun/Moon Orb -->
  <circle cx="600" cy="65" r="55" fill="url(#amberGlow)" />
  <circle cx="600" cy="65" r="18" fill="#FEF3C7" filter="url(#softGlow)" />

  <!-- Volumetric Rays -->
  <polygon points="600,65 250,340 380,340" fill="url(#lightRay)" />
  <polygon points="600,65 500,340 700,340" fill="url(#lightRay)" opacity="0.8" />
  <polygon points="600,65 820,340 950,340" fill="url(#lightRay)" />

  <!-- LAYER 1: Background Silhouette Mountains -->
  <path d="M 0,340 L 0,190 L 110,140 L 240,210 L 380,120 L 520,220 L 680,130 L 840,220 L 980,115 L 1110,195 L 1200,150 L 1200,340 Z" fill="#0f2611" opacity="0.85" />

  <!-- LAYER 2: Far 3D Faceted Volcanic Peaks -->
  <g opacity="0.9">
    <polygon points="220,125 100,240 220,240 215,180" fill="url(#sunlitFar)" />
    <polygon points="220,125 215,180 220,240 340,240" fill="url(#shadowFacet)" />
    <polygon points="220,125 185,160 220,165 245,160" fill="url(#snowLight)" opacity="0.85" />

    <polygon points="960,110 830,230 960,230 955,170" fill="url(#amberFacet)" />
    <polygon points="960,110 955,170 960,230 1080,230" fill="url(#shadowFacet)" />
    <polygon points="960,110 925,145 960,150 985,145" fill="url(#snowLight)" opacity="0.85" />
  </g>

  <!-- Mid-Layer Atmospheric Fog -->
  <rect x="0" y="180" width="1200" height="70" fill="url(#fogGrad)" />

  <!-- LAYER 3: FOREGROUND VOLCANIC RIDGE MOUNTAIN RANGE -->
  <g>
    <!-- LEFT MAIN PEAK -->
    <polygon points="340,95 140,280 335,280 345,185" fill="url(#sunlitFacet)" />
    <polygon points="340,95 345,185 335,280 230,280" fill="url(#amberFacet)" opacity="0.9" />
    <polygon points="340,95 345,185 335,280 500,280" fill="url(#shadowFacet)" />
    <polyline points="340,95 345,185 335,280" stroke="#F59E0B" stroke-width="2" opacity="0.8" fill="none" />
    <polygon points="340,95 295,142 342,148" fill="url(#snowLight)" />
    <polygon points="340,95 342,148 375,140" fill="url(#snowShadow)" />

    <!-- RIGHT MAIN PEAK -->
    <polygon points="880,90 690,280 875,280 885,175" fill="url(#sunlitFacet)" />
    <polygon points="880,90 885,175 875,280 1060,280" fill="url(#shadowFacet)" />
    <polyline points="880,90 885,175 875,280" stroke="#F59E0B" stroke-width="2" opacity="0.8" fill="none" />
    <polygon points="880,90 835,138 882,144" fill="url(#snowLight)" />
    <polygon points="880,90 882,144 915,135" fill="url(#snowShadow)" />

    <!-- CENTRAL MAJESTIC VOLCANIC SUMMIT -->
    <polygon points="600,70 390,290 595,290 605,160" fill="url(#sunlitFacet)" />
    <polygon points="600,70 605,160 595,290 500,290" fill="url(#amberFacet)" opacity="0.85" />
    <polygon points="600,70 605,160 595,290 810,290" fill="url(#shadowFacet)" />
    <polyline points="600,70 605,160 595,290" stroke="#F59E0B" stroke-width="3" opacity="0.9" fill="none" />
    <polygon points="600,70 545,130 602,138" fill="url(#snowLight)" />
    <polygon points="600,70 602,138 648,125" fill="url(#snowShadow)" />
    <polygon points="602,138 545,130 520,160 598,165" fill="url(#snowLight)" opacity="0.9" />
  </g>

  <!-- Foreground Valley Mist -->
  <path d="M 0,260 Q 300,220 600,250 T 1200,240 L 1200,340 L 0,340 Z" fill="url(#fogGrad)" />

  <!-- LAYER 4: Foreground Alpine Ridge & Dense Trees -->
  <path d="M 0,340 L 0,270 L 160,230 L 320,275 L 480,210 L 640,270 L 800,215 L 960,270 L 1120,225 L 1200,255 L 1200,340 Z" fill="#04120C" />

  <!-- Pine Tree Silhouettes -->
  <g>
    <g fill="#103014">
      <path d="M 30,310 L 42,260 L 33,260 L 42,240 L 36,240 L 42,220 L 48,240 L 42,240 L 51,260 L 42,260 L 54,310 Z" />
      <path d="M 120,320 L 132,265 L 123,265 L 132,245 L 126,245 L 132,225 L 138,245 L 132,245 L 141,265 L 132,265 L 144,320 Z" />
      <path d="M 1060,320 L 1072,265 L 1063,265 L 1072,245 L 1066,245 L 1072,225 L 1078,245 L 1072,245 L 1081,265 L 1072,265 L 1084,320 Z" />
      <path d="M 1140,310 L 1152,255 L 1143,255 L 1152,235 L 1146,235 L 1152,215 L 1158,235 L 1152,235 L 1161,255 L 1152,255 L 1164,310 Z" />
    </g>
    <g fill="#05170a">
      <path d="M 70,340 L 85,270 L 75,270 L 85,245 L 78,245 L 85,220 L 92,245 L 85,245 L 95,270 L 85,270 L 100,340 Z" />
      <path d="M 150,340 L 162,280 L 153,280 L 162,255 L 156,255 L 162,230 L 168,255 L 162,255 L 171,280 L 162,280 L 174,340 Z" />
      <path d="M 1020,340 L 1035,270 L 1025,270 L 1035,245 L 1028,245 L 1035,220 L 1042,245 L 1035,245 L 1045,270 L 1035,270 L 1050,340 Z" />
      <path d="M 1100,340 L 1112,275 L 1103,275 L 1112,250 L 1106,250 L 1112,225 L 1118,250 L 1112,250 L 1121,275 L 1112,275 L 1124,340 Z" />
    </g>
  </g>

  <!-- Glowing Volcanic Compass & Peak Summit Crest -->
  <g transform="translate(600, 50)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="22" fill="#04120C" stroke="#F59E0B" stroke-width="2.5" opacity="0.95" />
    <polygon points="0,-15 5,0 0,15 -5,0" fill="#F59E0B" />
    <polygon points="-15,0 0,5 15,0 0,-5" fill="#84CC16" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- 3D FLOATING TYPOGRAPHY -->
  <g filter="url(#textShadow)">
    <text x="600" y="118" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="1.5">
      AHMAD AMRI FALAH
    </text>

    <text x="600" y="152" text-anchor="middle" fill="#F59E0B" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="3">
      CONTENT STRATEGIST &amp; TECHNICAL SEO SPECIALIST
    </text>

    <rect x="350" y="185" width="500" height="2" fill="#84CC16" opacity="0.7" />

    <text x="600" y="215" text-anchor="middle" fill="#D9F99D" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" font-style="italic">
      "Strategi Konten &amp; Technical SEO Terukur Menuju Puncak Trafik &amp; Konversi 🌋📈"
    </text>
  </g>

  <!-- Volcanic Ridge Accent Outer Border -->
  <rect x="0" y="0" width="1200" height="340" fill="none" stroke="#F59E0B" stroke-width="2" rx="16" opacity="0.5" />
</svg>
