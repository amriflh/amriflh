<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020906" />
      <stop offset="40%" stop-color="#05170f" />
      <stop offset="75%" stop-color="#04120C" />
      <stop offset="100%" stop-color="#0d3322" />
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECFDF5" stop-opacity="1" />
      <stop offset="30%" stop-color="#A7F3D0" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#34D399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sunlitFacet" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0b2e1e" />
    </linearGradient>

    <linearGradient id="shadowFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3824" />
      <stop offset="60%" stop-color="#05170e" />
      <stop offset="100%" stop-color="#020b06" />
    </linearGradient>

    <linearGradient id="sunlitFar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#061e13" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="snowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <linearGradient id="snowShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="60%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#04120c" stop-opacity="0.8" />
    </linearGradient>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#10B981" flood-opacity="0.4" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#skyGrad)" rx="16" />

  <path d="M 0,100 Q 300,40 600,110 T 1200,70 L 1200,0 L 0,0 Z" fill="url(#moonGlow)" opacity="0.35" />

  <g fill="#ECFDF5">
    <circle cx="90" cy="35" r="1.5" opacity="0.9" />
    <circle cx="210" cy="65" r="2" opacity="0.8" />
    <circle cx="340" cy="25" r="1.2" opacity="0.6" />
    <circle cx="480" cy="50" r="1.8" opacity="0.85" />
    <circle cx="720" cy="30" r="1.4" opacity="0.75" />
    <circle cx="860" cy="60" r="2.2" opacity="0.95" />
    <circle cx="1020" cy="20" r="1.3" opacity="0.7" />
    <circle cx="1110" cy="70" r="1.7" opacity="0.8" />
  </g>

  <g filter="url(#softGlow)">
    <circle cx="980" cy="75" r="65" fill="url(#moonGlow)" opacity="0.25" />
    <circle cx="980" cy="75" r="28" fill="#ECFDF5" opacity="0.9" />
  </g>

  <path d="M 120,320 L 320,130 L 520,320 Z" fill="url(#sunlitFar)" />
  <path d="M 320,130 L 520,320 L 320,320 Z" fill="url(#shadowFacet)" opacity="0.7" />

  <path d="M 680,320 L 880,110 L 1080,320 Z" fill="url(#sunlitFar)" />
  <path d="M 880,110 L 1080,320 L 880,320 Z" fill="url(#shadowFacet)" opacity="0.8" />

  <g>
    <polygon points="580,70 210,320 580,320" fill="url(#sunlitFacet)" />
    <polygon points="580,70 580,320 950,320" fill="url(#shadowFacet)" />
    <polygon points="580,70 520,180 580,240 640,170" fill="url(#sunlitFacet)" opacity="0.4" />
    <polygon points="580,70 540,115 580,135" fill="url(#snowLight)" />
    <polygon points="580,70 580,135 620,110" fill="url(#snowShadow)" />
  </g>

  <rect y="230" width="1200" height="110" fill="url(#fogGrad)" />

  <g text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#textShadow)">
    <text x="600" y="125" font-size="44" font-weight="900" fill="#ECFDF5" letter-spacing="4">
      AHMAD AMRI FALAH
    </text>

    <text x="600" y="165" font-size="18" font-weight="700" fill="#34D399" letter-spacing="2">
      CONTENT STRATEGIST &amp; TECHNICAL SEO SPECIALIST
    </text>

    <rect x="350" y="185" width="500" height="2" fill="#10B981" opacity="0.6" />

    <text x="600" y="215" font-size="14" font-weight="500" fill="#A7F3D0" letter-spacing="1">
      Strategi Konten &amp; Technical SEO Terukur Menuju Puncak Trafik &amp; Konversi 🏔️📈
    </text>
  </g>

  <rect x="0" y="0" width="1200" height="340" fill="none" stroke="#10B981" stroke-width="2" rx="16" opacity="0.4" />
</svg>
